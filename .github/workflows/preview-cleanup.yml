name: Preview cleanup

on:
  pull_request:
    branches: [main]
    types: [closed]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Match the preview job's group so closing a PR cancels any deployment that
  # could otherwise recreate the Worker after cleanup finishes.
  group: ${{ github.event_name == 'pull_request' && format('cloudflare-preview-pr-{0}', github.event.pull_request.number) || 'cloudflare-preview-reconciliation' }}
  cancel-in-progress: true

jobs:
  delete-previews:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find stale preview Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          CLOSED_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          candidates_file="${RUNNER_TEMP}/stale-preview-workers.txt"

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            printf 'session-party-pr-%s\n' "${CLOSED_PR_NUMBER}" > "${candidates_file}"
            exit 0
          fi

          open_prs="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[].number')"
          scripts_file="${RUNNER_TEMP}/cloudflare-workers.json"
          curl --fail --silent --show-error --max-time 30 \
            -o "${scripts_file}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts"
          jq -e '.success == true' "${scripts_file}" >/dev/null
          jq -r --arg open_prs "${open_prs}" '
            .result[]
            | select(.id | test("^session-party-pr-[0-9]+$"))
            | select(
                (.id | sub("session-party-pr-"; "")) as $number
                | ($open_prs | split("\n") | index($number) | not)
              )
            | .id
          ' "${scripts_file}" > "${candidates_file}"

      - name: Delete stale preview Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          candidates_file="${RUNNER_TEMP}/stale-preview-workers.txt"
          deleted=0

          while IFS= read -r worker_name; do
            [[ "${worker_name}" =~ ^session-party-pr-[0-9]+$ ]] || continue
            response_file="${RUNNER_TEMP}/${worker_name}-delete.json"
            status="$(curl --silent --show-error --max-time 30 \
              -o "${response_file}" \
              -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker_name}")"

            case "${status}" in
              200)
                jq -e '.success == true' "${response_file}" >/dev/null
                deleted=$((deleted + 1))
                ;;
              204)
                deleted=$((deleted + 1))
                ;;
              404)
                echo "${worker_name} is already absent."
                ;;
              *)
                cat "${response_file}"
                exit 1
                ;;
            esac
          done < "${candidates_file}"

          echo "Deleted ${deleted} stale preview Worker(s)."
