name: Preview cleanup

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  delete-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_WORKER_NAME: session-party-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Delete preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/preview-delete-response.json"
          status="$(curl --silent --show-error --max-time 30 \
            -o "${response_file}" \
            -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER_NAME}")"
          case "${status}" in
            200|204|404) ;;
            *) cat "${response_file}"; exit 1 ;;
          esac
