name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run ci

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PREVIEW_WORKER_NAME: session-party-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check preview eligibility
        id: policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- migrations/; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish migration preview skip
        if: steps.policy.outputs.deploy != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- session-party-cloudflare-preview -->";
            const body = [
              marker,
              "Cloudflare preview skipped: this PR changes `migrations/**`.",
              "",
              "Migration parity still runs in CI. PR workflows never apply remote migrations; any preview URL from an earlier revision is stale.",
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - uses: pnpm/action-setup@v4
        if: steps.policy.outputs.deploy == 'true'
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        if: steps.policy.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.policy.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile
      - name: Resolve preview URL
        if: steps.policy.outputs.deploy == 'true'
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          subdomain_response="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          workers_subdomain="$(jq -er '.result.subdomain' <<<"${subdomain_response}")"
          preview_url="https://${PREVIEW_WORKER_NAME}.${workers_subdomain}.workers.dev"
          echo "url=${preview_url}" >> "${GITHUB_OUTPUT}"
      - name: Build preview artifact
        if: steps.policy.outputs.deploy == 'true'
        run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
          PREVIEW_APP_URL: ${{ steps.preview.outputs.url }}
      - name: Deploy PR Worker
        if: steps.policy.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secrets_file="${RUNNER_TEMP}/preview-secrets.env"
          umask 077
          printf 'SESSION_SECRET=%s\n' "$(openssl rand -hex 32)" > "${secrets_file}"
          pnpm exec wrangler deploy \
            --config dist/session_party/wrangler.json \
            --secrets-file "${secrets_file}" \
            --message "PR #${{ github.event.pull_request.number }} at ${GITHUB_SHA}"
      - name: Smoke test preview
        if: steps.policy.outputs.deploy == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 "${PREVIEW_URL}/" >/dev/null
      - name: Publish preview link
        if: steps.policy.outputs.deploy == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = "<!-- session-party-cloudflare-preview -->";
            const body = [
              marker,
              `Cloudflare preview: ${process.env.PREVIEW_URL}`,
              "",
              `Updated for \`${context.sha.slice(0, 7)}\`. This preview has read/write production D1 and R2 bindings. PRs changing migrations are skipped; mail, Turnstile, and Accelevents use preview-safe adapters.`,
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply remote D1 migrations
        run: pnpm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
