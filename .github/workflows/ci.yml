name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run ci

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PREVIEW_WORKER_NAME: session-party-pr-${{ github.event.pull_request.number }}
      PREVIEW_DATABASE_PREFIX: session-party-pr-${{ github.event.pull_request.number }}-db
      PREVIEW_BUCKET_NAME: session-party-pr-${{ github.event.pull_request.number }}-files
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve preview URL and provision isolated storage
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          subdomain_response="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          workers_subdomain="$(jq -er '.result.subdomain' <<<"${subdomain_response}")"
          preview_url="https://${PREVIEW_WORKER_NAME}.${workers_subdomain}.workers.dev"
          echo "url=${preview_url}" >> "${GITHUB_OUTPUT}"

          # D1 records applied migrations by filename. Key the database to the
          # exact migrations tree so rewritten histories never reuse an
          # incompatible schema. Code-only pushes continue using the same DB.
          migration_tree="$(git rev-parse HEAD:migrations)"
          migration_revision="${migration_tree:0:12}"
          preview_database_name="${PREVIEW_DATABASE_PREFIX}-${migration_revision}"
          echo "PREVIEW_DATABASE_NAME=${preview_database_name}" >> "${GITHUB_ENV}"
          echo "database_name=${preview_database_name}" >> "${GITHUB_OUTPUT}"
          echo "migration_revision=${migration_revision}" >> "${GITHUB_OUTPUT}"

          if ! pnpm exec wrangler d1 info "${preview_database_name}" --json >/dev/null 2>&1; then
            pnpm exec wrangler d1 create "${preview_database_name}" --location wnam
          fi

          bucket_response="${RUNNER_TEMP}/preview-r2-bucket.json"
          bucket_status="$(curl --silent --show-error --max-time 30 \
            --output "${bucket_response}" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${PREVIEW_BUCKET_NAME}")"
          case "${bucket_status}" in
            200) ;;
            404) pnpm exec wrangler r2 bucket create "${PREVIEW_BUCKET_NAME}" --location wnam ;;
            *)
              jq -r '.errors[]?.message // empty' "${bucket_response}" >&2
              exit 1
              ;;
          esac
      - name: Build preview artifact
        run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
          PREVIEW_APP_URL: ${{ steps.preview.outputs.url }}
      - name: Apply preview D1 migrations
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply DB --remote --config dist/session_party/wrangler.json
          integrity_result="${RUNNER_TEMP}/preview-d1-integrity.json"
          pnpm exec wrangler d1 execute DB \
            --remote \
            --config dist/session_party/wrangler.json \
            --command 'PRAGMA quick_check; PRAGMA foreign_key_check;' \
            --json > "${integrity_result}"
          jq -e '
            length == 2 and
            .[0].success == true and
            .[0].results == [{"quick_check":"ok"}] and
            .[1].success == true and
            .[1].results == []
          ' "${integrity_result}" >/dev/null
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy PR Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secrets_file="${RUNNER_TEMP}/preview-secrets.env"
          umask 077
          printf 'SESSION_SECRET=%s\n' "$(openssl rand -hex 32)" > "${secrets_file}"
          pnpm exec wrangler deploy \
            --config dist/session_party/wrangler.json \
            --secrets-file "${secrets_file}" \
            --message "PR #${{ github.event.pull_request.number }} at ${GITHUB_SHA}"
      - name: Smoke test preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 20 "${PREVIEW_URL}/" >/dev/null
      - name: Publish preview link
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_MIGRATION_REVISION: ${{ steps.preview.outputs.migration_revision }}
        with:
          script: |
            const marker = "<!-- session-party-cloudflare-preview -->";
            const body = [
              marker,
              `Cloudflare preview: ${process.env.PREVIEW_URL}`,
              "",
              `Updated for \`${context.sha.slice(0, 7)}\`. D1 is isolated to migration tree \`${process.env.PREVIEW_MIGRATION_REVISION}\`; R2 and Durable Objects are isolated to this PR. Mail, Turnstile, and Accelevents use preview-safe adapters.`,
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply remote D1 migrations
        run: pnpm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
