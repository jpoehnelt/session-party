name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Static checks and builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:registry
      - run: pnpm check:types
      - run: pnpm test:visual-tools
      - run: pnpm build
      - run: pnpm storybook:build

  worker-tests:
    name: Worker tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:worker --shard=${{ matrix.shard }}/3

  component-browser-tests:
    name: Audit browser and Storybook tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run full audit browser suite
        run: pnpm test:audit-browser
      - name: Run Storybook tests
        if: ${{ !cancelled() }}
        run: pnpm test:storybook
      - name: Upload component-browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-browser-results-${{ github.sha }}
          path: |
            screenshots/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  qa-tests:
    name: Full browser QA (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium, desktop-firefox, desktop-webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install QA browser
        env:
          QA_PROJECT: ${{ matrix.project }}
        run: |
          case "${QA_PROJECT}" in
            desktop-chromium|mobile-chromium) browser=chromium ;;
            desktop-firefox) browser=firefox ;;
            desktop-webkit) browser=webkit ;;
          esac
          pnpm exec playwright install --with-deps "${browser}"
      - name: Run full QA suite
        run: pnpm test:qa --project=${{ matrix.project }}
      - name: Upload QA report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results-${{ matrix.project }}-${{ github.sha }}
          path: |
            playwright-report-qa/
            test-results/qa/
          if-no-files-found: warn
          retention-days: 14

  rubric:
    name: Rubric grade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOOTSTRAP_RUBRIC_SCORE: "64.3"
      BOOTSTRAP_RUBRIC_EVIDENCE_COVERAGE: "0"
      BOOTSTRAP_RUBRIC_IMPLEMENTATION_GAP: "100"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install rubric browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Test rubric scoring
        run: pnpm rubric:test
      - name: Compute base-branch rubric grade
        id: base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            persisted_score="$(jq -er '.overallScorePct' rubric/baseline.json)"
            persisted_coverage="$(jq -er '.overallEvidenceCoveragePct' rubric/baseline.json)"
            persisted_gap="$(jq -er '.overallImplementationGapPct' rubric/baseline.json)"
            echo "score=${persisted_score}" >> "${GITHUB_OUTPUT}"
            echo "coverage=${persisted_coverage}" >> "${GITHUB_OUTPUT}"
            echo "gap=${persisted_gap}" >> "${GITHUB_OUTPUT}"
            echo "label=persisted baseline" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if git show "${BASE_SHA}:rubric/baseline.json" > "${RUNNER_TEMP}/rubric-base.json" 2>/dev/null; then
            base_score="$(jq -er '.overallScorePct' "${RUNNER_TEMP}/rubric-base.json")"
            base_coverage="$(jq -er '.overallEvidenceCoveragePct' "${RUNNER_TEMP}/rubric-base.json")"
            base_gap="$(jq -er '.overallImplementationGapPct' "${RUNNER_TEMP}/rubric-base.json")"
            echo "score=${base_score}" >> "${GITHUB_OUTPUT}"
            echo "coverage=${base_coverage}" >> "${GITHUB_OUTPUT}"
            echo "gap=${base_gap}" >> "${GITHUB_OUTPUT}"
            echo "label=main (${BASE_SHA:0:7})" >> "${GITHUB_OUTPUT}"
          else
            echo "score=${BOOTSTRAP_RUBRIC_SCORE}" >> "${GITHUB_OUTPUT}"
            echo "coverage=${BOOTSTRAP_RUBRIC_EVIDENCE_COVERAGE}" >> "${GITHUB_OUTPUT}"
            echo "gap=${BOOTSTRAP_RUBRIC_IMPLEMENTATION_GAP}" >> "${GITHUB_OUTPUT}"
            echo "label=bootstrap floor" >> "${GITHUB_OUTPUT}"
          fi
      - name: Run non-decreasing rubric gate
        env:
          BASE_SCORE: ${{ steps.base.outputs.score }}
          BASE_COVERAGE: ${{ steps.base.outputs.coverage }}
          BASE_GAP: ${{ steps.base.outputs.gap }}
        run: pnpm rubric:run --output .rubric/head --min-score "${BASE_SCORE}" --min-evidence-coverage "${BASE_COVERAGE}" --max-implementation-gap "${BASE_GAP}"
      - name: Verify persisted rubric grade
        shell: bash
        env:
          BASE_SCORE: ${{ steps.base.outputs.score }}
          BASE_COVERAGE: ${{ steps.base.outputs.coverage }}
          BASE_GAP: ${{ steps.base.outputs.gap }}
        run: |
          jq '{
            schemaVersion: 2,
            rubricRevision,
            overallScorePct: (.overallScorePct * 10 | round / 10),
            overallEvidenceCoveragePct: (.overallEvidenceCoveragePct * 10 | round / 10),
            overallImplementationGapPct: (.overallImplementationGapPct * 10 | round / 10),
            areas: (.required | map({key: .area, value: (.scorePct * 10 | round / 10)}) | from_entries)
          }' .rubric/head/report.json > .rubric/expected-baseline.json
          persisted_score="$(jq -er '.overallScorePct' rubric/baseline.json)"
          persisted_coverage="$(jq -er '.overallEvidenceCoveragePct' rubric/baseline.json)"
          persisted_gap="$(jq -er '.overallImplementationGapPct' rubric/baseline.json)"
          if ! jq -e --slurp '.[0] == .[1]' .rubric/expected-baseline.json rubric/baseline.json >/dev/null; then
            echo "Persisted rubric baseline must exactly match the computed PR grade." >&2
            echo "Run pnpm rubric:baseline and commit rubric/baseline.json." >&2
            exit 1
          fi
          if ! jq -en --argjson base "${BASE_SCORE}" --argjson persisted "${persisted_score}" '$persisted >= $base' >/dev/null; then
            echo "Persisted rubric grade cannot be lower than main (${BASE_SCORE}%)." >&2
            exit 1
          fi
          if ! jq -en --argjson base "${BASE_COVERAGE}" --argjson persisted "${persisted_coverage}" '$persisted >= $base' >/dev/null; then
            echo "Persisted rubric evidence coverage cannot be lower than main (${BASE_COVERAGE}%)." >&2
            exit 1
          fi
          if ! jq -en --argjson base "${BASE_GAP}" --argjson persisted "${persisted_gap}" '$persisted <= $base' >/dev/null; then
            echo "Persisted rubric implementation-gap weight cannot be higher than main (${BASE_GAP}%)." >&2
            exit 1
          fi
      - name: Publish rubric grade
        if: always()
        shell: bash
        env:
          BASE_LABEL: ${{ steps.base.outputs.label }}
          BASE_SCORE: ${{ steps.base.outputs.score }}
        run: |
          if [[ -f .rubric/head/report.md ]]; then
            head_score="$(jq -er '.overallScorePct' .rubric/head/report.json)"
            persisted_score="$(jq -er '.overallScorePct' rubric/baseline.json)"
            delta="$(jq -nr --argjson base "${BASE_SCORE}" --argjson head "${head_score}" '$head - $base')"
            status="$(jq -nr --argjson base "${BASE_SCORE}" --argjson head "${head_score}" 'if $head >= $base then "✅ non-decreasing" else "❌ regression" end')"
            {
              echo "# Rubric grade"
              echo
              echo "| Base | PR head | Persisted | Change | Status |"
              echo "|---|---:|---:|---:|---|"
              printf '| %s: %.1f%% | %.1f%% | %.1f%% | %+.1f | %s |\n' "${BASE_LABEL}" "${BASE_SCORE}" "${head_score}" "${persisted_score}" "${delta}" "${status}"
              echo
              cat .rubric/head/report.md
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "# Deterministic rubric report" >> "${GITHUB_STEP_SUMMARY}"
            echo >> "${GITHUB_STEP_SUMMARY}"
            echo "The rubric run did not produce a report." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload rubric reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubric-report
          path: |
            .rubric/head/report.md
            .rubric/head/report.json
            .rubric/expected-baseline.json
            rubric/baseline.json
          if-no-files-found: warn
          retention-days: 30

  # Preserve the existing required check and keep preview/deploy behind every shard.
  ci:
    if: always()
    needs: [checks, rubric, worker-tests, component-browser-tests, qa-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          RUBRIC_RESULT: ${{ needs.rubric.result }}
          WORKER_TESTS_RESULT: ${{ needs.worker-tests.result }}
          COMPONENT_BROWSER_TESTS_RESULT: ${{ needs.component-browser-tests.result }}
          QA_TESTS_RESULT: ${{ needs.qa-tests.result }}
        run: |
          test "${CHECKS_RESULT}" = "success"
          test "${RUBRIC_RESULT}" = "success"
          test "${WORKER_TESTS_RESULT}" = "success"
          test "${COMPONENT_BROWSER_TESTS_RESULT}" = "success"
          test "${QA_TESTS_RESULT}" = "success"

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PREVIEW_WORKER_NAME: session-party-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check preview eligibility
        id: policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- migrations/; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Delete stale preview Worker
        if: steps.policy.outputs.deploy != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/preview-delete-response.json"
          status="$(curl --silent --show-error --max-time 30 \
            -o "${response_file}" \
            -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER_NAME}")"
          case "${status}" in
            200|204|404) ;;
            *) cat "${response_file}"; exit 1 ;;
          esac
      - name: Publish migration preview skip
        if: steps.policy.outputs.deploy != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- session-party-cloudflare-preview -->";
            const body = [
              marker,
              "Cloudflare preview skipped: this PR changes `migrations/**`.",
              "",
              "Migration parity still runs in CI. PR workflows never apply remote migrations; any earlier preview Worker has been deleted.",
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - uses: pnpm/action-setup@v4
        if: steps.policy.outputs.deploy == 'true'
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        if: steps.policy.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.policy.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile
      - name: Resolve preview URL
        if: steps.policy.outputs.deploy == 'true'
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          subdomain_response="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          workers_subdomain="$(jq -er '.result.subdomain' <<<"${subdomain_response}")"
          preview_url="https://${PREVIEW_WORKER_NAME}.${workers_subdomain}.workers.dev"
          echo "url=${preview_url}" >> "${GITHUB_OUTPUT}"
      - name: Build preview artifact
        if: steps.policy.outputs.deploy == 'true'
        run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
          PREVIEW_APP_URL: ${{ steps.preview.outputs.url }}
      - name: Verify preview storage isolation
        if: steps.policy.outputs.deploy == 'true'
        run: |
          jq -e '
            ((.d1_databases // []) | length == 0) and
            ((.r2_buckets // []) | length == 0) and
            ((.triggers.crons // []) | length == 0)
          ' dist/session_party/wrangler.json >/dev/null
      - name: Deploy PR Worker
        if: steps.policy.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          secrets_file="${RUNNER_TEMP}/preview-secrets.env"
          umask 077
          printf 'SESSION_SECRET=%s\n' "$(openssl rand -hex 32)" > "${secrets_file}"
          pnpm exec wrangler deploy \
            --config dist/session_party/wrangler.json \
            --secrets-file "${secrets_file}" \
            --message "PR #${{ github.event.pull_request.number }} at ${GITHUB_SHA}"
      - name: Smoke test preview
        if: steps.policy.outputs.deploy == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          curl --fail --silent --show-error \
            --retry 72 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 360 \
            --max-time 20 \
            "${PREVIEW_URL}/" >/dev/null
      - name: Publish preview link
        if: steps.policy.outputs.deploy == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = "<!-- session-party-cloudflare-preview -->";
            const body = [
              marker,
              `Cloudflare preview: ${process.env.PREVIEW_URL}`,
              "",
              `Updated for \`${context.sha.slice(0, 7)}\`. This UI-only preview has no D1 or R2 bindings, and scheduled jobs are disabled. API-backed workflows require dedicated preview storage.`,
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply remote D1 migrations
        run: pnpm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
